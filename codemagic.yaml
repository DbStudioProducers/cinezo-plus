workflows:
  android-debug:
    name: CineZo+ Android Debug
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: v20
    triggering:
      events: [push]
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Instalar dependencias
        script: npm install
      - name: Adicionar plataforma Android
        script: npm run cap:add:android
      - name: Sincronizar assets
        script: npm run cap:sync
      - name: Build APK
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          yggdrasilagencia@gmail.com
        notify:
          success: true
          failure: true

  android-release:
    name: CineZo+ Android Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: v20
      vars:
        KEYSTORE_BASE64: "SUA_KEYSTORE_BASE64_AQUI"
        KEYSTORE_PASSWORD: "SUA_SENHA_AQUI"
        KEY_ALIAS: "cinezoplus"
        KEY_PASSWORD: "SUA_SENHA_AQUI"
    triggering:
      events: [tag]
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Instalar dependencias
        script: npm install
      - name: Adicionar plataforma Android
        script: npm run cap:add:android
      - name: Sincronizar
        script: npm run cap:sync
      - name: Decodificar keystore
        script: echo $KEYSTORE_BASE64 | base64 --decode > android/keystore.jks
      - name: Build Release
        script: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=keystore.jks \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD
    artifacts:
      - android/app/build/outputs/apk/release/*.apk

  ios-debug:
    name: CineZo+ iOS Debug
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: v20
      xcode: 15.4
    triggering:
      events: [push]
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Instalar dependencias
        script: npm install
      - name: Adicionar iOS
        script: npm run cap:add:ios
      - name: Sincronizar
        script: npm run cap:sync
      - name: Build iOS
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphoneos -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO | xcpretty
    artifacts:
      - ios/App/build/**/*.app
    publishing:
      email:
        recipients:
          yggdrasilagencia@gmail.com
