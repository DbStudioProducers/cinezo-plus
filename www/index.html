<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineZo+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --bg: #0b1021;
  --bg-surface: #131a2e;
  --bg-card: #1a2240;
  --bg-elevated: #212b4a;
  --accent: #0063e5;
  --accent-hover: #0483dd;
  --accent-glow: rgba(0,99,229,0.35);
  --text: #f0f1f5;
  --text-muted: #8990a8;
  --text-dim: #5a6178;
  --border: rgba(255,255,255,0.06);
  --nav-h: 64px;
  --sidebar-w: 68px;
  --radius: 8px;
  --radius-lg: 14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background:var(--bg);color:var(--text);
  overflow-x:hidden;min-height:100vh;
}
::-webkit-scrollbar{height:4px;width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg-elevated);border-radius:10px}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{display:block;max-width:100%}

/* ===== TELA DE CARREGAMENTO ===== */
#loading-screen{
  position:fixed;inset:0;z-index:9999;
  background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .6s,visibility .6s;
}
#loading-screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
#loading-screen .logo-text{
  font-size:3rem;font-weight:900;letter-spacing:-1px;
  background:linear-gradient(135deg,#0063e5,#00d4ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:loadPulse 1.5s ease-in-out infinite;
}
#loading-screen .load-bar{
  margin-top:28px;width:180px;height:3px;
  background:var(--bg-card);border-radius:3px;overflow:hidden;
}
#loading-screen .load-bar-inner{
  height:100%;width:0;background:linear-gradient(90deg,#0063e5,#00d4ff);
  border-radius:3px;animation:loadBar 2s ease-in-out forwards;
}
@keyframes loadPulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes loadBar{0%{width:0}100%{width:100%}}

/* ===== NAVEGAÇÃO SUPERIOR ===== */
#top-nav{
  position:fixed;top:0;left:0;right:0;z-index:1000;
  height:var(--nav-h);
  display:flex;align-items:center;gap:20px;
  padding:0 24px 0 0;
  background:linear-gradient(180deg,rgba(11,16,33,.95) 0%,rgba(11,16,33,.7) 100%);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  transition:background .3s;
}
#top-nav.scrolled{background:rgba(11,16,33,.98)}
.nav-logo{
  width:var(--sidebar-w);height:var(--nav-h);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.nav-logo span{
  font-size:1.3rem;font-weight:900;letter-spacing:-0.5px;
  background:linear-gradient(135deg,#0063e5,#00d4ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.nav-links{display:flex;gap:6px;flex:1;overflow-x:auto}
.nav-links button{
  padding:8px 16px;border-radius:20px;font-size:.82rem;font-weight:600;
  white-space:nowrap;transition:all .25s;color:var(--text-muted);
}
.nav-links button:hover{color:var(--text)}
.nav-links button.active{background:var(--accent);color:#fff}
.nav-search{
  position:relative;width:220px;flex-shrink:0;
}
.nav-search input{
  width:100%;padding:8px 14px 8px 36px;
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:20px;color:var(--text);font-size:.85rem;
  outline:none;transition:border-color .25s,box-shadow .25s;
}
.nav-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.nav-search input::placeholder{color:var(--text-dim)}
.nav-search i{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  color:var(--text-dim);font-size:.85rem;
}
.nav-browse-btn{
  padding:8px 18px;border-radius:20px;font-size:.82rem;font-weight:600;
  background:var(--bg-card);border:1px solid var(--border);
  transition:all .25s;white-space:nowrap;
}
.nav-browse-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ===== CONTEÚDO PRINCIPAL ===== */
#main{
  margin-top:var(--nav-h);
  padding-left:var(--sidebar-w);
  min-height:calc(100vh - var(--nav-h));
}

/* ===== HERO ===== */
#hero{
  position:relative;width:100%;height:70vh;min-height:440px;
  overflow:hidden;
}
#hero-bg{
  position:absolute;inset:0;
  background-size:cover;background-position:center top;
  transition:opacity .8s;
}
#hero-bg::after{
  content:'';position:absolute;inset:0;
  background:
    linear-gradient(0deg,var(--bg) 0%,rgba(11,16,33,.4) 40%,rgba(11,16,33,.1) 60%,rgba(11,16,33,.3) 100%),
    linear-gradient(90deg,rgba(11,16,33,.85) 0%,transparent 60%);
}
#hero-content{
  position:absolute;bottom:15%;left:48px;max-width:520px;z-index:2;
}
#hero-content .hero-tag{
  display:inline-block;padding:4px 12px;border-radius:4px;
  background:var(--accent);font-size:.72rem;font-weight:700;
  text-transform:uppercase;letter-spacing:1px;margin-bottom:14px;
}
#hero-content h1{
  font-size:2.8rem;font-weight:900;line-height:1.1;
  margin-bottom:14px;letter-spacing:-1px;
  text-shadow:0 2px 20px rgba(0,0,0,.6);
}
#hero-content p{
  font-size:.95rem;line-height:1.6;color:var(--text-muted);
  margin-bottom:24px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.hero-btns{display:flex;gap:12px;flex-wrap:wrap}
.btn-play{
  display:inline-flex;align-items:center;gap:8px;
  padding:14px 28px;border-radius:6px;
  background:#fff;color:#0b1021;
  font-size:.95rem;font-weight:700;
  transition:all .25s;
}
.btn-play:hover{background:#d4e4ff;transform:scale(1.03)}
.btn-info{
  display:inline-flex;align-items:center;gap:8px;
  padding:14px 28px;border-radius:6px;
  background:rgba(255,255,255,.12);color:#fff;
  font-size:.95rem;font-weight:600;
  backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.15);
  transition:all .25s;
}
.btn-info:hover{background:rgba(255,255,255,.2);transform:scale(1.03)}

/* Hero dots */
#hero-dots{
  position:absolute;bottom:8%;left:48px;display:flex;gap:8px;z-index:2;
}
#hero-dots button{
  width:10px;height:10px;border-radius:50%;
  background:rgba(255,255,255,.3);transition:all .3s;
}
#hero-dots button.active{background:#fff;width:28px;border-radius:5px}

/* ===== CARROSSEIS ===== */
.section{
  padding:0 48px;margin-bottom:40px;
}
.section-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;
}
.section-header h2{
  font-size:1.25rem;font-weight:800;letter-spacing:-0.3px;
}
.section-header .see-all{
  font-size:.82rem;font-weight:600;color:var(--accent);
  transition:color .2s;
}
.section-header .see-all:hover{color:var(--accent-hover)}

.carousel-wrapper{position:relative}
.carousel-row{
  display:flex;gap:12px;overflow-x:auto;
  scroll-snap-type:x mandatory;
  scroll-behavior:smooth;
  padding:8px 0 16px;
  -ms-overflow-style:none;scrollbar-width:none;
}
.carousel-row::-webkit-scrollbar{display:none}

.card{
  flex:0 0 auto;width:220px;
  border-radius:var(--radius);overflow:hidden;
  position:relative;cursor:pointer;
  scroll-snap-align:start;
  transition:transform .3s cubic-bezier(.23,1,.32,1),box-shadow .3s;
  background:var(--bg-card);
}
.card:hover{
  transform:scale(1.08) translateY(-6px);
  box-shadow:0 14px 40px rgba(0,0,0,.6),0 0 0 2px var(--accent);
  z-index:10;
}
.card-img{
  width:100%;aspect-ratio:16/9;object-fit:cover;
  background:var(--bg-elevated);
  transition:filter .3s;
}
.card:hover .card-img{filter:brightness(1.1)}
.card-overlay{
  position:absolute;inset:0;
  background:linear-gradient(0deg,rgba(11,16,33,.92) 0%,transparent 60%);
  opacity:0;transition:opacity .3s;
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:14px;
}
.card:hover .card-overlay{opacity:1}
.card-overlay h3{font-size:.85rem;font-weight:700;line-height:1.3}
.card-overlay .card-meta{font-size:.7rem;color:var(--text-muted);margin-top:4px}
.card-overlay .card-play{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);
  width:44px;height:44px;border-radius:50%;
  background:rgba(0,99,229,.85);display:flex;align-items:center;justify-content:center;
  font-size:1rem;color:#fff;backdrop-filter:blur(4px);
  transition:transform .3s,background .2s;
}
.card:hover .card-play{transform:translate(-50%,-50%)}
.card-play:hover{background:var(--accent)}

/* Carousel arrows */
.carousel-arrow{
  position:absolute;top:50%;transform:translateY(-50%);
  width:40px;height:80px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(11,16,33,.7);backdrop-filter:blur(6px);
  border-radius:4px;font-size:1rem;color:#fff;
  z-index:5;transition:all .25s;opacity:0;
}
.carousel-wrapper:hover .carousel-arrow{opacity:1}
.carousel-arrow:hover{background:rgba(0,99,229,.8)}
.carousel-arrow.left{left:0}
.carousel-arrow.right{right:0}

/* ===== SKELETON ===== */
.skeleton-card{
  flex:0 0 auto;width:220px;border-radius:var(--radius);overflow:hidden;
  background:var(--bg-card);
}
.skeleton-img{
  width:100%;aspect-ratio:16/9;
  background:linear-gradient(90deg,var(--bg-card) 25%,var(--bg-elevated) 50%,var(--bg-card) 75%);
  background-size:200% 100%;
  animation:shimmer 1.5s infinite;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ===== MODAL ===== */
#modal-overlay{
  position:fixed;inset:0;z-index:2000;
  background:rgba(0,0,0,.75);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transition:all .35s;
}
#modal-overlay.open{opacity:1;visibility:visible}
#modal{
  width:92%;max-width:780px;max-height:90vh;
  background:var(--bg-surface);border-radius:var(--radius-lg);
  overflow:hidden;position:relative;
  transform:translateY(30px) scale(.96);
  transition:transform .4s cubic-bezier(.23,1,.32,1);
}
#modal-overlay.open #modal{transform:translateY(0) scale(1)}
#modal-close{
  position:absolute;top:14px;right:14px;z-index:10;
  width:36px;height:36px;border-radius:50%;
  background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;
  font-size:.9rem;transition:background .2s;
}
#modal-close:hover{background:var(--accent)}
#modal-hero{
  width:100%;aspect-ratio:16/8;position:relative;overflow:hidden;
}
#modal-hero img{
  width:100%;height:100%;object-fit:cover;
}
#modal-hero::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(0deg,var(--bg-surface) 0%,transparent 60%);
}
#modal-body{padding:0 28px 28px;margin-top:-40px;position:relative;z-index:2}
#modal-body h2{font-size:1.6rem;font-weight:900;margin-bottom:8px}
#modal-body .modal-meta{
  display:flex;gap:12px;flex-wrap:wrap;
  font-size:.8rem;color:var(--text-muted);margin-bottom:16px;
}
#modal-body .modal-meta span{
  display:flex;align-items:center;gap:4px;
}
#modal-body .modal-desc{
  font-size:.9rem;line-height:1.7;color:var(--text-muted);margin-bottom:24px;
}
.modal-actions{display:flex;gap:12px;flex-wrap:wrap}

/* ===== MODO NAVEGAÇÃO (IFRAME) ===== */
#browser-view{
  position:fixed;inset:0;z-index:3000;
  background:var(--bg);display:none;flex-direction:column;
}
#browser-view.open{display:flex}
#browser-bar{
  height:52px;display:flex;align-items:center;gap:12px;
  padding:0 16px;background:var(--bg-surface);
  border-bottom:1px solid var(--border);flex-shrink:0;
}
#browser-bar .btn-icon{
  width:36px;height:36px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg-card);transition:background .2s;font-size:.85rem;
}
#browser-bar .btn-icon:hover{background:var(--accent)}
#browser-url{
  flex:1;padding:8px 14px;border-radius:8px;
  background:var(--bg-card);border:1px solid var(--border);
  color:var(--text);font-size:.82rem;outline:none;
}
#browser-iframe{flex:1;border:none;width:100%;background:#fff}

/* ===== TOAST ===== */
#toast-container{
  position:fixed;top:80px;right:20px;z-index:5000;
  display:flex;flex-direction:column;gap:8px;
}
.toast{
  padding:12px 20px;border-radius:var(--radius);
  background:var(--bg-elevated);border:1px solid var(--border);
  font-size:.85rem;font-weight:500;
  box-shadow:0 8px 30px rgba(0,0,0,.4);
  animation:toastIn .4s ease-out;
  display:flex;align-items:center;gap:10px;
}
.toast.error{border-color:#e53e3e;color:#fc8181}
.toast.success{border-color:#38a169;color:#68d391}
.toast.info{border-color:var(--accent);color:#63b3ed}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}

/* ===== SEM RESULTADOS ===== */
.no-results{
  text-align:center;padding:80px 20px;
}
.no-results i{font-size:3rem;color:var(--text-dim);margin-bottom:16px}
.no-results h3{font-size:1.2rem;font-weight:700;margin-bottom:8px}
.no-results p{color:var(--text-muted);font-size:.9rem}

/* ===== FOOTER ===== */
footer{
  padding:40px 48px;text-align:center;
  color:var(--text-dim);font-size:.75rem;
  border-top:1px solid var(--border);
}
footer a{color:var(--accent);transition:color .2s}
footer a:hover{color:var(--accent-hover)}

/* ===== RESPONSIVO ===== */
@media(max-width:900px){
  :root{--sidebar-w:0px}
  .nav-logo{display:none}
  #hero-content{left:24px;max-width:90%}
  #hero-content h1{font-size:1.8rem}
  #hero-dots{left:24px}
  .section{padding:0 20px}
  .card{width:160px}
  .skeleton-card{width:160px}
  #modal{width:96%;max-height:95vh}
  #modal-body{padding:0 18px 18px}
  #modal-body h2{font-size:1.2rem}
  .nav-search{width:140px}
  footer{padding:30px 20px}
}
@media(max-width:600px){
  .nav-links{display:none}
  #hero{height:55vh;min-height:320px}
  #hero-content h1{font-size:1.5rem}
  .card{width:140px}
  .section{padding:0 14px}
  .btn-play,.btn-info{padding:10px 18px;font-size:.85rem}
}

/* ===== ANIMAÇÕES ===== */
@media(prefers-reduced-motion:no-preference){
  .section{opacity:0;transform:translateY(30px);transition:opacity .6s,transform .6s}
  .section.visible{opacity:1;transform:translateY(0)}
}
</style>
</head>
<body>

<!-- Tela de carregamento -->
<div id="loading-screen">
  <div class="logo-text">CineZo+</div>
  <div class="load-bar"><div class="load-bar-inner"></div></div>
</div>

<!-- Navegação superior -->
<nav id="top-nav">
  <div class="nav-logo"><span>CZ+</span></div>
  <div class="nav-links" id="nav-links">
    <button class="active" data-cat="home">Início</button>
    <button data-cat="filmes">Filmes</button>
    <button data-cat="series">Séries</button>
    <button data-cat="animes">Animes</button>
    <button data-cat="lancamentos">Lançamentos</button>
  </div>
  <div class="nav-search">
    <i class="fas fa-search"></i>
    <input type="text" id="search-input" placeholder="Buscar conteúdo..." aria-label="Buscar conteúdo">
  </div>
  <button class="nav-browse-btn" id="browse-btn" title="Navegar pelo site original">
    <i class="fas fa-globe"></i> Navegar
  </button>
</nav>

<!-- Conteúdo principal -->
<main id="main">
  <!-- Hero -->
  <div id="hero">
    <div id="hero-bg"></div>
    <div id="hero-content">
      <span class="hero-tag">DESTAQUE</span>
      <h1 id="hero-title">Carregando...</h1>
      <p id="hero-desc"></p>
      <div class="hero-btns">
        <button class="btn-play" id="hero-play"><i class="fas fa-play"></i> Assistir</button>
        <button class="btn-info" id="hero-info"><i class="fas fa-info-circle"></i> Mais Info</button>
      </div>
    </div>
    <div id="hero-dots"></div>
  </div>

  <!-- Seções de conteúdo -->
  <div id="sections-container"></div>

  <footer>
    <p>CineZo+ — Conteúdo obtido de <a href="https://cinezo.net" target="_blank" rel="noopener">cinezo.net</a>. Este aplicativo é apenas uma interface de exibição.</p>
  </footer>
</main>

<!-- Modal de detalhes -->
<div id="modal-overlay" role="dialog" aria-modal="true">
  <div id="modal">
    <button id="modal-close" aria-label="Fechar"><i class="fas fa-times"></i></button>
    <div id="modal-hero"><img id="modal-img" alt=""></div>
    <div id="modal-body">
      <h2 id="modal-title"></h2>
      <div class="modal-meta" id="modal-meta"></div>
      <p class="modal-desc" id="modal-desc"></p>
      <div class="modal-actions">
        <button class="btn-play" id="modal-play"><i class="fas fa-play"></i> Assistir Agora</button>
        <button class="btn-info" id="modal-open-site"><i class="fas fa-external-link-alt"></i> Abrir no Site</button>
      </div>
    </div>
  </div>
</div>

<!-- Modo navegação (iframe) -->
<div id="browser-view">
  <div id="browser-bar">
    <button class="btn-icon" id="browser-close" title="Fechar"><i class="fas fa-arrow-left"></i></button>
    <button class="btn-icon" id="browser-home" title="Página inicial"><i class="fas fa-home"></i></button>
    <input type="text" id="browser-url" readonly>
    <button class="btn-icon" id="browser-refresh" title="Recarregar"><i class="fas fa-redo"></i></button>
    <button class="btn-icon" id="browser-external" title="Abrir externamente"><i class="fas fa-external-link-alt"></i></button>
  </div>
  <iframe id="browser-iframe" sandbox="allow-same-origin allow-scripts allow-popups allow-forms" title="Navegador CineZo"></iframe>
</div>

<!-- Toast -->
<div id="toast-container"></div>

<script>
// ===== CONFIGURAÇÃO =====
const BASE_URL = 'https://cinezo.net';
const PROXIES = [
  url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
  url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
  url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
];

// ===== ESTADO =====
const state = {
  allItems: [],
  heroItems: [],
  currentHeroIdx: 0,
  heroInterval: null,
  isLoading: true,
  activeCategory: 'home',
  searchQuery: '',
};

// ===== UTILITÁRIOS =====
function resolveUrl(url, base = BASE_URL) {
  if (!url) return '';
  if (url.startsWith('http://') || url.startsWith('https://')) return url;
  if (url.startsWith('//')) return 'https:' + url;
  if (url.startsWith('/')) return base + url;
  return base + '/' + url;
}

function showToast(msg, type = 'info') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = `<i class="fas fa-${type === 'error' ? 'exclamation-circle' : type === 'success' ? 'check-circle' : 'info-circle'}"></i> ${msg}`;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 300); }, 4000);
}

// ===== FETCH COM PROXY =====
async function fetchWithProxy(url) {
  let lastError;
  for (const makeProxy of PROXIES) {
    try {
      const proxyUrl = makeProxy(url);
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 12000);
      const resp = await fetch(proxyUrl, { signal: ctrl.signal });
      clearTimeout(timer);
      if (!resp.ok) continue;
      const text = await resp.text();
      // allorigins retorna JSON
      try {
        const json = JSON.parse(text);
        if (json.contents) return json.contents;
      } catch {}
      return text;
    } catch (e) {
      lastError = e;
      continue;
    }
  }
  throw lastError || new Error('Falha ao buscar dados');
}

// ===== PARSER DO SITE =====
function parseContent(html, sourceUrl = BASE_URL) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  const items = [];
  const seen = new Set();

  function addItem(item) {
    if (!item.link || !item.image) return;
    item.link = resolveUrl(item.link, sourceUrl);
    item.image = resolveUrl(item.image, sourceUrl);
    if (item.link.includes('cinezo.net') && !seen.has(item.link)) {
      seen.add(item.link);
      items.push(item);
    }
  }

  // Estratégia 1: Procurar artigos/posts comuns em sites de streaming
  const selectors = [
    'article', '.post-item', '.movie-item', '.film-item', '.video-item',
    '.content-item', '.post', '.entry', '.card', '.item', '.m-item',
    '.listing-item', '.result-item', '[class*="movie"]', '[class*="film"]',
    '[class*="post-"]', '.col-item', '.thumb-item'
  ];

  for (const sel of selectors) {
    const els = doc.querySelectorAll(sel);
    if (els.length >= 3) {
      els.forEach(el => {
        const a = el.querySelector('a[href]');
        const img = el.querySelector('img');
        const title = el.querySelector('h1, h2, h3, h4, .title, .name, .entry-title, [class*="title"]');
        if (a && img) {
          addItem({
            title: title ? title.textContent.trim() : (img.alt || a.getAttribute('title') || ''),
            image: img.getAttribute('src') || img.getAttribute('data-src') || img.getAttribute('data-lazy-src') || img.getAttribute('data-original') || '',
            link: a.getAttribute('href') || '',
            description: el.querySelector('p, .desc, .description, .excerpt, .entry-excerpt')?.textContent?.trim() || '',
          });
        }
      });
      if (items.length >= 3) break;
    }
  }

  // Estratégia 2: Procurar links com imagens diretamente
  if (items.length < 3) {
    const allLinks = doc.querySelectorAll('a[href]');
    allLinks.forEach(a => {
      const img = a.querySelector('img');
      if (!img) return;
      const src = img.getAttribute('src') || img.getAttribute('data-src') || img.getAttribute('data-lazy-src') || img.getAttribute('data-original') || '';
      if (!src || src.includes('logo') || src.includes('icon') || src.includes('avatar') || src.includes('banner')) return;
      const w = parseInt(img.getAttribute('width') || 0);
      if (w > 0 && w < 50) return;
      const titleEl = a.querySelector('h1, h2, h3, h4, .title, .name');
      const href = a.getAttribute('href') || '';
      // Filtrar links de navegação, categorias, etc.
      if (href === '/' || href === '#' || href.includes('/page/') || href.includes('/category/') || href.includes('/tag/')) return;
      addItem({
        title: titleEl ? titleEl.textContent.trim() : (img.alt || a.getAttribute('title') || a.textContent.trim().substring(0, 80) || ''),
        image: src,
        link: href,
        description: '',
      });
    });
  }

  // Limpar títulos vazios
  items.forEach(item => {
    if (!item.title) item.title = 'Sem título';
    item.title = item.title.replace(/\s+/g, ' ').trim().substring(0, 100);
  });

  return items;
}

// Extrair categorias do menu do site
function parseCategories(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const cats = {};
  const menuLinks = doc.querySelectorAll('a[href]');
  menuLinks.forEach(a => {
    const href = a.getAttribute('href') || '';
    const text = a.textContent.trim().toLowerCase();
    if (text.includes('film') && !cats.filmes) cats.filmes = resolveUrl(href);
    if (text.includes('séri') || text.includes('serie') && !cats.series) cats.series = resolveUrl(href);
    if (text.includes('anim') && !cats.animes) cats.animes = resolveUrl(href);
    if ((text.includes('lanç') || text.includes('lanca') || text.includes('novo') || text.includes('recent')) && !cats.lancamentos) cats.lancamentos = resolveUrl(href);
  });
  return cats;
}

// ===== RENDERIZAÇÃO =====
function renderHero() {
  const items = state.heroItems;
  if (!items.length) return;
  const item = items[state.currentHeroIdx];
  const bg = document.getElementById('hero-bg');
  bg.style.backgroundImage = `url('${item.image}')`;
  document.getElementById('hero-title').textContent = item.title;
  document.getElementById('hero-desc').textContent = item.description || 'Clique para assistir agora no CineZo.';

  // Dots
  const dotsEl = document.getElementById('hero-dots');
  dotsEl.innerHTML = '';
  items.slice(0, 8).forEach((_, i) => {
    const dot = document.createElement('button');
    dot.className = i === state.currentHeroIdx ? 'active' : '';
    dot.setAttribute('aria-label', `Destaque ${i + 1}`);
    dot.onclick = () => {
      state.currentHeroIdx = i;
      renderHero();
      resetHeroInterval();
    };
    dotsEl.appendChild(dot);
  });
}

function nextHero() {
  if (state.heroItems.length < 2) return;
  state.currentHeroIdx = (state.currentHeroIdx + 1) % Math.min(state.heroItems.length, 8);
  renderHero();
}

function resetHeroInterval() {
  clearInterval(state.heroInterval);
  state.heroInterval = setInterval(nextHero, 7000);
}

function createCard(item) {
  const card = document.createElement('div');
  card.className = 'card';
  card.setAttribute('tabindex', '0');
  card.setAttribute('role', 'button');
  card.setAttribute('aria-label', item.title);
  card.innerHTML = `
    <img class="card-img" src="${item.image}" alt="${item.title}" loading="lazy" onerror="this.style.background='var(--bg-elevated)';this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 320 180%22><rect fill=%22%231a2240%22 width=%22320%22 height=%22180%22/><text x=%22160%22 y=%2290%22 fill=%22%235a6178%22 text-anchor=%22middle%22 font-size=%2214%22>Sem imagem</text></svg>'">
    <div class="card-overlay">
      <div class="card-play"><i class="fas fa-play" style="margin-left:2px"></i></div>
      <h3>${item.title}</h3>
      <div class="card-meta">${item.description ? item.description.substring(0, 60) + '...' : 'CineZo'}</div>
    </div>
  `;
  card.addEventListener('click', () => openModal(item));
  card.addEventListener('keydown', e => { if (e.key === 'Enter') openModal(item); });
  return card;
}

function createSkeletons(count = 8) {
  return Array.from({ length: count }, () => {
    const s = document.createElement('div');
    s.className = 'skeleton-card';
    s.innerHTML = '<div class="skeleton-img"></div>';
    return s;
  });
}

function renderSection(title, items, container) {
  if (!items.length) return;
  const section = document.createElement('section');
  section.className = 'section';

  const id = title.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
  section.innerHTML = `
    <div class="section-header">
      <h2>${title}</h2>
    </div>
    <div class="carousel-wrapper">
      <button class="carousel-arrow left" aria-label="Anterior"><i class="fas fa-chevron-left"></i></button>
      <div class="carousel-row" id="row-${id}"></div>
      <button class="carousel-arrow right" aria-label="Próximo"><i class="fas fa-chevron-right"></i></button>
    </div>
  `;

  const row = section.querySelector('.carousel-row');
  items.forEach(item => row.appendChild(createCard(item)));

  // Arrow handlers
  const leftArrow = section.querySelector('.carousel-arrow.left');
  const rightArrow = section.querySelector('.carousel-arrow.right');
  leftArrow.addEventListener('click', () => row.scrollBy({ left: -680, behavior: 'smooth' }));
  rightArrow.addEventListener('click', () => row.scrollBy({ left: 680, behavior: 'smooth' }));

  container.appendChild(section);

  // Animar entrada
  requestAnimationFrame(() => {
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
    }, { threshold: 0.1 });
    obs.observe(section);
  });
}

function renderAllSections() {
  const container = document.getElementById('sections-container');
  container.innerHTML = '';

  const query = state.searchQuery.toLowerCase();
  let filtered = state.allItems;
  if (query) {
    filtered = filtered.filter(item => item.title.toLowerCase().includes(query));
  }

  if (!filtered.length) {
    container.innerHTML = `
      <div class="no-results">
        <i class="fas fa-search"></i>
        <h3>${query ? 'Nenhum resultado para "' + state.searchQuery + '"' : 'Nenhum conteúdo encontrado'}</h3>
        <p>${query ? 'Tente outro termo de busca.' : 'O site pode estar indisponível no momento. Tente o modo Navegação.'}</p>
      </div>
    `;
    return;
  }

  // Dividir em seções
  const perSection = Math.min(20, Math.ceil(filtered.length / Math.max(1, Math.floor(filtered.length / 15))));
  const sectionNames = ['Em Alta', 'Populares', 'Para Você', 'Mais Vistos', 'Destaques', 'Catálogo', 'Novidades', 'Recomendados', 'Top Picks', 'Explorar'];
  let idx = 0;
  let sIdx = 0;
  while (idx < filtered.length && sIdx < 10) {
    const batch = filtered.slice(idx, idx + perSection);
    renderSection(sectionNames[sIdx % sectionNames.length], batch, container);
    idx += perSection;
    sIdx++;
  }
}

// ===== MODAL =====
function openModal(item) {
  document.getElementById('modal-img').src = item.image;
  document.getElementById('modal-title').textContent = item.title;
  document.getElementById('modal-desc').textContent = item.description || 'Clique em "Assistir Agora" para ver o conteúdo completo no CineZo.';
  document.getElementById('modal-meta').innerHTML = `
    <span><i class="fas fa-play-circle"></i> CineZo</span>
    <span><i class="fas fa-globe"></i> Online</span>
    <span><i class="fas fa-hd"></i> HD</span>
  `;
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';

  document.getElementById('modal-play').onclick = () => openBrowser(item.link);
  document.getElementById('modal-open-site').onclick = () => window.open(item.link, '_blank');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

// ===== MODO NAVEGAÇÃO =====
function openBrowser(url = BASE_URL) {
  const view = document.getElementById('browser-view');
  const iframe = document.getElementById('browser-iframe');
  const urlInput = document.getElementById('browser-url');
  view.classList.add('open');
  urlInput.value = url;
  iframe.src = url;
  document.body.style.overflow = 'hidden';
}

function closeBrowser() {
  const view = document.getElementById('browser-view');
  const iframe = document.getElementById('browser-iframe');
  view.classList.remove('open');
  iframe.src = 'about:blank';
  document.body.style.overflow = '';
}

// ===== BUSCA =====
let searchTimeout;
function handleSearch(query) {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    state.searchQuery = query.trim();
    renderAllSections();
  }, 300);
}

// ===== CATEGORIAS =====
async function loadCategory(cat) {
  state.activeCategory = cat;
  document.querySelectorAll('.nav-links button').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));

  if (cat === 'home') {
    renderAllSections();
    return;
  }

  const container = document.getElementById('sections-container');
  container.innerHTML = '';
  const row = document.createElement('div');
  row.className = 'section';
  row.innerHTML = `<div class="section-header"><h2>Carregando...</h2></div>
    <div class="carousel-wrapper"><div class="carousel-row" id="row-cat-load"></div></div>`;
  container.appendChild(row);
  const rowEl = row.querySelector('.carousel-row');
  rowEl.append(...createSkeletons(10));

  const catUrls = {
    filmes: ['/filmes', '/category/filmes', '/filme'],
    series: ['/series', '/category/series', '/serie'],
    animes: ['/animes', '/category/animes', '/anime'],
    lancamentos: ['/lancamentos', '/category/lancamentos', '/novos', '/page/1'],
  };

  const paths = catUrls[cat] || [];
  let items = [];

  for (const path of paths) {
    try {
      const html = await fetchWithProxy(BASE_URL + path);
      items = parseContent(html, BASE_URL + path);
      if (items.length >= 3) break;
    } catch {}
  }

  container.innerHTML = '';
  if (items.length) {
    state.searchQuery = '';
    document.getElementById('search-input').value = '';
    renderSection(cat.charAt(0).toUpperCase() + cat.slice(1), items, container);
  } else {
    container.innerHTML = `
      <div class="no-results">
        <i class="fas fa-film"></i>
        <h3>Não foi possível carregar esta categoria</h3>
        <p>Tente usar o modo Navegação para explorar o site diretamente.</p>
      </div>
    `;
  }
}

// ===== SCROLL NAV =====
function handleScroll() {
  const nav = document.getElementById('top-nav');
  nav.classList.toggle('scrolled', window.scrollY > 40);
}

// ===== INICIALIZAÇÃO =====
async function init() {
  const loadingScreen = document.getElementById('loading-screen');
  const heroPlay = document.getElementById('hero-play');
  const heroInfo = document.getElementById('hero-info');

  // Hero buttons
  heroPlay.addEventListener('click', () => {
    if (state.heroItems.length) openBrowser(state.heroItems[state.currentHeroIdx].link);
  });
  heroInfo.addEventListener('click', () => {
    if (state.heroItems.length) openModal(state.heroItems[state.currentHeroIdx]);
  });

  // Modal events
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeModal();
  });

  // Browser events
  document.getElementById('browse-btn').addEventListener('click', () => openBrowser());
  document.getElementById('browser-close').addEventListener('click', closeBrowser);
  document.getElementById('browser-home').addEventListener('click', () => {
    document.getElementById('browser-iframe').src = BASE_URL;
    document.getElementById('browser-url').value = BASE_URL;
  });
  document.getElementById('browser-refresh').addEventListener('click', () => {
    const iframe = document.getElementById('browser-iframe');
    iframe.src = iframe.src;
  });
  document.getElementById('browser-external').addEventListener('click', () => {
    window.open(document.getElementById('browser-url').value, '_blank');
  });

  // Search
  document.getElementById('search-input').addEventListener('input', e => handleSearch(e.target.value));

  // Nav categories
  document.getElementById('nav-links').addEventListener('click', e => {
    const btn = e.target.closest('button[data-cat]');
    if (btn) loadCategory(btn.dataset.cat);
  });

  // Scroll
  window.addEventListener('scroll', handleScroll, { passive: true });

  // Keyboard
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (document.getElementById('browser-view').classList.contains('open')) closeBrowser();
      else closeModal();
    }
  });

  // Buscar conteúdo
  try {
    showToast('Conectando ao CineZo...', 'info');

    // Buscar a página principal
    const html = await fetchWithProxy(BASE_URL);
    const items = parseContent(html);

    if (items.length === 0) {
      throw new Error('Não foi possível extrair conteúdo da página.');
    }

    state.allItems = items;
    state.heroItems = items.filter(i => i.image && i.title).slice(0, 8);
    state.currentHeroIdx = 0;

    // Renderizar hero e seções
    renderHero();
    resetHeroInterval();
    renderAllSections();

    showToast(`${items.length} conteúdos carregados com sucesso!`, 'success');

  } catch (err) {
    console.error('Erro ao carregar:', err);
    showToast('Não foi possível carregar o conteúdo. Use o modo Navegação.', 'error');

    // Renderizar hero padrão
    document.getElementById('hero-title').textContent = 'CineZo+';
    document.getElementById('hero-desc').textContent = 'Use o botão "Navegar" para acessar o site completo do CineZo diretamente.';
    document.getElementById('hero-bg').style.background = 'linear-gradient(135deg, #0b1021 0%, #1a2240 50%, #0b1021 100%)';

    document.getElementById('sections-container').innerHTML = `
      <div class="no-results">
        <i class="fas fa-satellite-dish"></i>
        <h3>Modo Navegação Disponível</h3>
        <p>O conteúdo será carregado diretamente do site. Clique no botão "Navegar" acima para começar.</p>
        <button class="btn-play" style="margin-top:20px" onclick="openBrowser()"><i class="fas fa-globe"></i> Abrir Navegação</button>
      </div>
    `;
  }

  // Esconder loading
  loadingScreen.classList.add('hidden');
  setTimeout(() => loadingScreen.remove(), 600);
}

// Iniciar
init();
</script>
