<style>
:root{--bg:#0b1021;--bg-s:#131a2e;--bg-c:#1a2240;--bg-e:#212b4a;--acc:#0063e5;--tx:#f0f1f5;--tx-m:#8990a8;--tx-d:#5a6178;--bd:rgba(255,255,255,.06);--nav:58px;--rad:8px;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--tx);overflow-x:hidden;min-height:100dvh}
::-webkit-scrollbar{height:3px;width:3px}::-webkit-scrollbar-thumb{background:var(--bg-e);border-radius:9px}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;-webkit-tap-highlight-color:transparent}img{display:block;max-width:100%}
#splash{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s,visibility .4s}
#splash.gone{opacity:0;visibility:hidden;pointer-events:none}
.s-logo{font-size:2.5rem;font-weight:900;background:linear-gradient(135deg,#0063e5,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.s-bar{margin-top:20px;width:140px;height:3px;background:var(--bg-c);border-radius:3px;overflow:hidden}
.s-fill{height:100%;width:0;background:linear-gradient(90deg,#0063e5,#00d4ff);animation:lf 1.6s ease forwards}
@keyframes lf{to{width:100%}}
#nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding-top:var(--st);height:calc(var(--nav) + var(--st));display:flex;align-items:center;gap:8px;padding-left:12px;padding-right:12px;background:rgba(11,16,33,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--bd)}
.brand{font-size:1.1rem;font-weight:900;background:linear-gradient(135deg,#0063e5,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;width:36px;text-align:center;flex-shrink:0}
.cats{display:flex;gap:3px;flex:1;overflow-x:auto;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.cats button{padding:5px 11px;border-radius:16px;font-size:.72rem;font-weight:600;white-space:nowrap;color:var(--tx-m);transition:.2s}
.cats button.on{background:var(--acc);color:#fff}
.ni{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--tx-m);font-size:.8rem;flex-shrink:0;transition:.2s}
.ni:hover{color:var(--acc)}.ni.spin i{animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sr{position:relative;width:32px;height:32px;flex-shrink:0;transition:width .3s}.sr.open{width:140px}
.sr input{width:100%;height:100%;padding:0 10px 0 28px;background:var(--bg-c);border:1px solid var(--bd);border-radius:16px;color:var(--tx);font-size:.76rem;outline:none;opacity:0;transition:.2s}
.sr.open input{opacity:1}.sr input:focus{border-color:var(--acc)}
.sr .srb{position:absolute;right:0;top:0;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--tx-m);font-size:.8rem;z-index:2}
#app{padding-top:calc(var(--nav) + var(--st));min-height:100dvh}
#hero{position:relative;width:100%;height:55vh;min-height:300px;overflow:hidden}
#hbg{position:absolute;inset:0;background-size:cover;background-position:center 20%;transition:opacity .6s}
#hbg::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 0%,rgba(11,16,33,.4) 50%,rgba(11,16,33,.3) 100%),linear-gradient(90deg,rgba(11,16,33,.85) 0%,transparent 50%)}
#hinfo{position:absolute;bottom:10%;left:18px;right:36%;z-index:2}
#hinfo .tag{display:inline-block;padding:2px 8px;border-radius:3px;background:var(--acc);font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
#hinfo h1{font-size:1.6rem;font-weight:900;line-height:1.1;margin-bottom:6px;letter-spacing:-.3px}
#hinfo p{font-size:.78rem;line-height:1.5;color:var(--tx-m);margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hb{display:flex;gap:8px;flex-wrap:wrap}
.bw{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:5px;background:#fff;color:#0b1021;font-size:.82rem;font-weight:700;transition:.2s}
.bg{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:5px;background:rgba(255,255,255,.1);color:#fff;font-size:.82rem;font-weight:600;border:1px solid rgba(255,255,255,.1);transition:.2s}
#dots{position:absolute;bottom:5%;left:18px;display:flex;gap:5px;z-index:2}
#dots button{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3);transition:.3s}#dots button.on{background:#fff;width:20px;border-radius:3px}
.sec{padding:0 18px 24px;margin-bottom:4px}.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.sec-h h2{font-size:1rem;font-weight:800}
.cw{position:relative}.cr{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:4px 0 8px;scrollbar-width:none}.cr::-webkit-scrollbar{display:none}
.cd{flex:0 0 auto;width:130px;border-radius:var(--rad);overflow:hidden;position:relative;cursor:pointer;scroll-snap-align:start;transition:transform .3s,box-shadow .3s;background:var(--bg-c)}
.cd:active{transform:scale(.97)}.cd:hover{transform:scale(1.05) translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.5),0 0 0 2px var(--acc);z-index:10}
.cd img{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--bg-e)}
.cd .ov{position:absolute;inset:0;background:linear-gradient(0deg,rgba(11,16,33,.9) 0%,transparent 50%);opacity:0;transition:.3s;display:flex;flex-direction:column;justify-content:flex-end;padding:8px}
.cd:hover .ov{opacity:1}.cd .ov h3{font-size:.68rem;font-weight:700;line-height:1.2}.cd .ov .sub{font-size:.56rem;color:var(--tx-m);margin-top:2px}
.cd .ov .pl{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);width:32px;height:32px;border-radius:50%;background:rgba(0,99,229,.85);display:flex;align-items:center;justify-content:center;font-size:.72rem;color:#fff;opacity:0;transition:.3s}
.cd:hover .pl{opacity:1}
.cw .ar{position:absolute;top:50%;transform:translateY(-50%);width:28px;height:56px;display:flex;align-items:center;justify-content:center;background:rgba(11,16,33,.7);backdrop-filter:blur(4px);border-radius:3px;font-size:.72rem;color:#fff;z-index:5;opacity:0;transition:.2s}
.cw:hover .ar{opacity:1}.ar:hover{background:rgba(0,99,229,.7)}.ar.l{left:0}.ar.r{right:0}
.sk{flex:0 0 auto;width:130px;border-radius:var(--rad);overflow:hidden;background:var(--bg-c)}.sk .si{width:100%;aspect-ratio:16/9;background:linear-gradient(90deg,var(--bg-c) 25%,var(--bg-e) 50%,var(--bg-c) 75%);background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{0%{background-position:200% 0}to{background-position:-200% 0}}
.tvg{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;padding:0 18px 24px}
.tvc{background:var(--bg-c);border-radius:var(--rad);overflow:hidden;cursor:pointer;transition:.2s;border:2px solid transparent}
.tvc:hover{border-color:var(--acc);transform:translateY(-2px)}
.tvc img{width:100%;aspect-ratio:1/1;object-fit:contain;background:var(--bg-e);padding:6px}
.tvc .tn{padding:5px 6px;font-size:.64rem;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mov{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.85);display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;transition:.3s}
#mov.on{opacity:1;visibility:visible}
#md{width:100%;max-width:540px;max-height:90vh;background:var(--bg-s);border-radius:14px 14px 0 0;overflow-y:auto;transform:translateY(100%);transition:transform .4s cubic-bezier(.23,1,.32,1)}
#mov.on #md{transform:translateY(0)}
#mx{position:absolute;top:10px;right:10px;z-index:10;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:.7rem;transition:.2s}#mx:hover{background:var(--acc)}
#miw{width:100%;aspect-ratio:16/9;position:relative;overflow:hidden}
#miw img{width:100%;height:100%;object-fit:cover}
#miw::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,var(--bg-s) 0%,transparent 40%)}
#mpb{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:rgba(0,99,229,.9);display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:#fff;z-index:3;box-shadow:0 4px 16px rgba(0,99,229,.4);transition:.2s}
#mpb:hover{transform:translate(-50%,-50%) scale(1.1)}
#mbd{padding:0 16px calc(16px + var(--sb));margin-top:-18px;position:relative;z-index:2}
#mbd h2{font-size:1.2rem;font-weight:900;margin-bottom:5px}
.mm{display:flex;gap:8px;flex-wrap:wrap;font-size:.66rem;color:var(--tx-m);margin-bottom:10px}.mm span{display:flex;align-items:center;gap:3px}
.md{font-size:.8rem;line-height:1.6;color:var(--tx-m);margin-bottom:14px}
.mbs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sv{margin-top:8px}.sv h4{font-size:.74rem;font-weight:700;margin-bottom:5px;color:var(--tx-m)}
.sv .sl{display:flex;gap:5px;flex-wrap:wrap}
.sv button{padding:4px 10px;border-radius:4px;background:var(--bg-c);border:1px solid var(--bd);font-size:.68rem;font-weight:600;color:var(--tx-m);transition:.2s}
.sv button:hover,.sv button.on{border-color:var(--acc);color:var(--acc);background:rgba(0,99,229,.08)}
#plr{position:fixed;inset:0;z-index:3000;background:#000;display:none;flex-direction:column}
#plr.on{display:flex}
#pb{padding-top:var(--st);height:calc(42px + var(--st));display:flex;align-items:center;gap:8px;padding-left:10px;padding-right:10px;background:linear-gradient(180deg,rgba(0,0,0,.85),transparent);position:absolute;top:0;left:0;right:0;z-index:10;transition:opacity .3s}
#pb.hide{opacity:0;pointer-events:none}
#pb .pbi{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-size:.8rem}
#pb .pbi:hover{background:rgba(255,255,255,.1)}
#pb .ptt{flex:1;font-size:.78rem;font-weight:600;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pw{flex:1;position:relative;background:#000}
#pw iframe,#pw video{width:100%;height:100%;border:none;position:absolute;inset:0;background:#000}
#pld{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--tx-m);z-index:5}
#pld i{font-size:1.6rem;color:var(--acc);animation:sp 1s linear infinite}
#per{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--tx-m);text-align:center;padding:20px;z-index:5}
#per i{font-size:1.8rem;color:var(--tx-d)}
#ptp{position:absolute;inset:0;z-index:4}
#tst{position:fixed;top:calc(var(--nav) + var(--st) + 6px);right:8px;z-index:5000;display:flex;flex-direction:column;gap:4px}
.t{padding:7px 12px;border-radius:var(--rad);background:var(--bg-e);border:1px solid var(--bd);font-size:.74rem;font-weight:500;box-shadow:0 4px 14px rgba(0,0,0,.4);animation:ti .3s ease-out;display:flex;align-items:center;gap:5px}
.t.e{border-color:#e53e3e;color:#fc8181}.t.s{border-color:#38a169;color:#68d391}.t.i{border-color:var(--acc);color:#63b3ed}
@keyframes ti{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
.emp{text-align:center;padding:40px 18px}.emp i{font-size:1.8rem;color:var(--tx-d);margin-bottom:10px}.emp h3{font-size:.95rem;font-weight:700;margin-bottom:4px}.emp p{color:var(--tx-m);font-size:.8rem}
footer{padding:16px 14px calc(16px + var(--sb));text-align:center;color:var(--tx-d);font-size:.62rem;border-top:1px solid var(--bd)}
@media(prefers-reduced-motion:no-preference){.sec{opacity:0;transform:translateY(16px);transition:opacity .4s,transform .4s}.sec.vis{opacity:1;transform:translateY(0)}}
@media(min-width:768px){:root{--nav:62px}.cd{width:180px}.sk{width:180px}.sec{padding:0 34px 28px}#hero{height:60vh;min-height:360px}#hinfo{left:34px;right:40%}#hinfo h1{font-size:2.2rem}#dots{left:34px}.sr{width:160px}.sr input{opacity:1}.sr .srb{left:0;right:auto}#mov{align-items:center}#md{max-height:86vh;border-radius:14px}.tvg{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}
@media(min-width:1024px){.cd{width:200px}.sk{width:200px}#hinfo{right:48%}#hinfo h1{font-size:2.6rem}}
</style>
</head>
<body>
<div id="splash"><div class="s-logo">CineZo+</div><div class="s-bar"><div class="s-fill"></div></div></div>

    <div id="ptp"></div>
  </div>
</div>
<div id="tst"></div>
<script>
var TK='2564ea1dcd828935333abd8ad31decf9';
var VER=5;
var TB='https://api.themoviedb.org/3';
var IM='https://image.tmdb.org/t/p/w500';
var IB='https://image.tmdb.org/t/p/w1280';

var EM=[
  function(i,t){return t==='movie'?'https://vidsrc.dev/embed/movie/'+i:'https://vidsrc.dev/embed/tv/'+i+'/1/1'},
  function(i,t){return t==='movie'?'https://vidsrc.cc/v2/embed/movie/'+i:'https://vidsrc.cc/v2/embed/tv/'+i+'/1/1'},
  function(i,t){return t==='movie'?'https://embed.su/embed/movie/'+i:'https://embed.su/embed/tv/'+i+'/1/1'}
];

var S={hero:[],hi:0,hT:null,cat:'home',q:'',cur:null,barT:null,tv:[],hls:null,ytKey:''};

function toast(m,t){t=t||'i';var c=document.getElementById('tst'),e=document.createElement('div');e.className='t '+t[0];var ic=t==='e'?'exclamation-circle':t==='s'?'check-circle':'info-circle';e.innerHTML='<i class="fas fa-'+ic+'"></i>'+m;c.appendChild(e);setTimeout(function(){e.style.opacity='0';e.style.transition='opacity .3s';setTimeout(function(){e.remove()},300)},3000)}

function api(ep,p){p=p||{};p.api_key=TK;p.language='pt-BR';var qs=Object.keys(p).map(function(k){return k+'='+encodeURIComponent(p[k])}).join('&');return fetch(TB+ep+'?'+qs).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}

/* === AUTO UPDATE === */
function checkUpd(){
  var url=window.location.href.replace(/index\.html.*/,'')+'version.json?t='+Date.now();
  fetch(url).then(function(r){return r.json()}).then(function(d){
    if(d.version&&d.version>VER){toast('Atualizando...','i');setTimeout(function(){window.location.reload(true)},1200)}
  }).catch(function(){});
}

/* === HERO === */
function rH(){var h=S.hero;if(!h.length)return;var c=h[S.hi];document.getElementById('hbg').style.backgroundImage="url('"+IB+(c.backdrop_path||'')+"')";document.getElementById('htitle').textContent=c.title||c.name||'';document.getElementById('hdesc').textContent=c.overview||'Assista agora no CineZo+';var d=document.getElementById('dots');d.innerHTML='';var n=Math.min(h.length,8);for(var i=0;i<n;i++){(function(x){var b=document.createElement('button');b.className=x===S.hi?'on':'';b.onclick=function(){S.hi=x;rH();rHT()};d.appendChild(b)})(i)}}
function nH(){if(S.hero.length<2)return;S.hi=(S.hi+1)%Math.min(S.hero.length,8);rH()}
function rHT(){clearInterval(S.hT);S.hT=setInterval(nH,6000)}

/* === CARDS === */
function mkC(o){var d=document.createElement('div');d.className='cd';d.tabIndex=0;var img=o.backdrop_path?IM+o.backdrop_path:(o.poster_path?IM+o.poster_path:'');var fb="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 180'%3E%3Crect fill='%231a2240' width='320' height='180'/%3E%3Ctext x='160' y='90' fill='%235a6178' text-anchor='middle' font-size='12'%3ESem imagem%3C/text%3E%3C/svg%3E";var t=o.title||o.name||'';var y=(o.release_date||o.first_air_date||'').substring(0,4);d.innerHTML='<img src="'+img+'" alt="'+t+'" loading="lazy" onerror="this.src=\''+fb+'\'"><div class="ov"><div class="pl"><i class="fas fa-play" style="margin-left:2px"></i></div><h3>'+t+'</h3><div class="sub">'+(y?y+' — ':'')+(o.vote_average?o.vote_average.toFixed(1)+' ⭐':'')+'</div></div>';d.onclick=function(){openM(o)};return d}
function mkS(n){var a=[];for(var i=0;i<(n||8);i++){var d=document.createElement('div');d.className='sk';d.innerHTML='<div class="si"></div>';a.push(d)}return a}

function rSec(title,items,ctn){if(!items.length)return;var sec=document.createElement('section');sec.className='sec';var id=title.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');sec.innerHTML='<div class="sec-h"><h2>'+title+'</h2></div><div class="cw"><button class="ar l"><i class="fas fa-chevron-left"></i></button><div class="cr" id="r-'+id+'"></div><button class="ar r"><i class="fas fa-chevron-right"></i></button></div>';var row=sec.querySelector('.cr');for(var i=0;i<items.length;i++)row.appendChild(mkC(items[i]));sec.querySelector('.ar.l').onclick=function(){row.scrollBy({left:-500,behavior:'smooth'})};sec.querySelector('.ar.r').onclick=function(){row.scrollBy({left:500,behavior:'smooth'})};ctn.appendChild(sec);requestAnimationFrame(function(){var ob=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('vis');ob.unobserve(e.target)}})},{threshold:.05});ob.observe(sec)})}

/* === HOME === */
function loadHome(){var c=document.getElementById('secs');c.innerHTML='';var tmp=document.createElement('div');tmp.className='cw';var cr=document.createElement('div');cr.className='cr';var sk=mkS(10);for(var i=0;i<sk.length;i++)cr.appendChild(sk[i]);tmp.appendChild(cr);c.appendChild(tmp);
Promise.all([api('/trending/movie/week'),api('/trending/tv/week'),api('/movie/popular'),api('/tv/popular'),api('/movie/now_playing'),api('/tv/on_the_air')]).then(function(r){c.innerHTML='';var tr=[].concat(r[0].results||[],r[1].results||[]);S.hero=tr.filter(function(i){return i.backdrop_path}).slice(0,8);S.hi=0;rH();rHT();if(r[0].results&&r[0].results.length)rSec('Filmes em Alta',r[0].results,c);if(r[1].results&&r[1].results.length)rSec('Series em Alta',r[1].results,c);if(r[4].results&&r[4].results.length)rSec('Nos Cinemas',r[4].results,c);if(r[2].results&&r[2].results.length)rSec('Filmes Populares',r[2].results,c);if(r[3].results&&r[3].results.length)rSec('Series Populares',r[3].results,c);if(r[5].results&&r[5].results.length)rSec('Series no Ar',r[5].results,c)}).catch(function(e){console.error(e);c.innerHTML='<div class="emp"><i class="fas fa-exclamation-circle"></i><h3>Erro ao carregar</h3><p>Verifique sua conexao</p></div>'})}

/* === CATEGORY === */
function loadCat(cat){S.cat=cat;var bs=document.querySelectorAll('.cats button');for(var i=0;i<bs.length;i++)bs[i].classList.toggle('on',bs[i].getAttribute('data-c')===cat);if(cat==='home'){loadHome();return}if(cat==='tv'){loadTV();return}var c=document.getElementById('secs');c.innerHTML='';var tmp=document.createElement('div');tmp.className='cw';var cr=document.createElement('div');cr.className='cr';var sk=mkS(10);for(var i=0;i<sk.length;i++)cr.appendChild(sk[i]);tmp.appendChild(cr);c.appendChild(tmp);var eps=cat==='filmes'?['/movie/popular','/movie/now_playing','/movie/top_rated','/movie/upcoming']:['/tv/popular','/tv/on_the_air','/tv/top_rated','/tv/airing_today'];var nms=cat==='filmes'?['Populares','Nos Cinemas','Mais Votados','Em Breve']:['Populares','No Ar','Mais Votadas','Exibindo Hoje'];Promise.all(eps.map(function(e){return api(e)})).then(function(r){c.innerHTML='';for(var i=0;i<r.length;i++){if(r[i].results&&r[i].results.length)rSec(nms[i],r[i].results,c)}}).catch(function(){c.innerHTML='<div class="emp"><i class="fas fa-film"></i><h3>Erro</h3></div>'})}

/* === SEARCH === */
function doSrch(q){if(!q){loadCat(S.cat);return}var c=document.getElementById('secs');c.innerHTML='';api('/search/multi',{query:q}).then(function(r){var items=(r.results||[]).filter(function(i){return i.media_type==='movie'||i.media_type==='tv'});if(items.length)rSec('Resultados para "'+q+'"',items,c);else c.innerHTML='<div class="emp"><i class="fas fa-search"></i><h3>Nenhum resultado</h3></div>'}).catch(function(){c.innerHTML='<div class="emp"><i class="fas fa-search"></i><h3>Erro na busca</h3></div>'})}

/* === TV AO VIVO === */
function parseM3U(txt){var lines=txt.split('\n');var ch=[];for(var i=0;i<lines.length;i++){if(lines[i].indexOf('#EXTINF')===0){var lg=lines[i].match(/tvg-logo="([^"]*)"/);var nm=lines[i].match(/,(.+)$/);var url='';for(var j=i+1;j<Math.min(i+3,lines.length);j++){var ln=lines[j].trim();if(ln&&ln.charAt(0)!=='#'){url=ln;break}}if(url&&nm)ch.push({name:nm[1].trim(),logo:lg?lg[1]:'',url:url})}}return ch}

function loadTV(){var c=document.getElementById('secs');c.innerHTML='<div class="emp"><i class="fas fa-spinner fa-spin"></i><h3>Carregando canais...</h3></div>';fetch('https://iptv-org.github.io/iptv/countries/br.m3u').then(function(r){if(!r.ok)throw new Error('');return r.text()}).then(function(txt){var channels=parseM3U(txt);S.tv=channels.filter(function(ch){return ch.logo});c.innerHTML='';if(!S.tv.length){c.innerHTML='<div class="emp"><i class="fas fa-tv"></i><h3>Nenhum canal</h3></div>';return}var grid=document.createElement('div');grid.className='tvg';var fb2="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%231a2240' width='100' height='100'/%3E%3Ctext x='50' y='55' fill='%235a6178' text-anchor='middle' font-size='10'%3ETV%3C/text%3E%3C/svg%3E";for(var i=0;i<S.tv.length;i++){(function(ch){var card=document.createElement('div');card.className='tvc';card.innerHTML='<img src="'+ch.logo+'" alt="'+ch.name+'" onerror="this.src=\''+fb2+'\'"><div class="tn">'+ch.name+'</div>';card.onclick=function(){playTV(ch)};grid.appendChild(card)})(S.tv[i])}c.appendChild(grid)}).catch(function(){c.innerHTML='<div class="emp"><i class="fas fa-tv"></i><h3>Erro ao carregar canais</h3></div>'})}

/* === MODAL === */
function openM(o){S.cur=o;var type=o.media_type||(o.first_air_date?'tv':'movie');var title=o.title||o.name||'';var year=(o.release_date||o.first_air_date||'').substring(0,4);var img=o.backdrop_path?IB+o.backdrop_path:(o.poster_path?IB+o.poster_path:'');document.getElementById('mimg').src=img;document.getElementById('mtt').textContent=title;document.getElementById('mdesc').textContent=o.overview||'Sem descricao disponivel.';var meta='<span><i class="fas fa-'+(type==='movie'?'film':'tv')+'"></i> '+(type==='movie'?'Filme':'Serie')+'</span>';if(year)meta+='<span><i class="fas fa-calendar"></i> '+year+'</span>';if(o.vote_average)meta+='<span style="color:#f6c02e"><i class="fas fa-star"></i> '+o.vote_average.toFixed(1)+'</span>';document.getElementById('mmeta').innerHTML=meta;
// Servers
var sl=document.getElementById('svlist');sl.innerHTML='';for(var i=0;i<EM.length;i++){(function(x){var b=document.createElement('button');b.textContent='Servidor '+(x+1);if(x===0)b.className='on';b.onclick=function(){S.cur._srv=x;var bs=sl.querySelectorAll('button');for(var j=0;j<bs.length;j++)bs[j].className='';b.className='on'};sl.appendChild(b)})(i)}S.cur._srv=0;S.ytKey='';
// Fetch trailer
var ep=type==='movie'?'/movie/'+o.id+'/videos':'/tv/'+o.id+'/videos';api(ep).then(function(d){if(d.results&&d.results.length){var tr=d.results.find(function(v){return v.type==='Trailer'&&v.site==='YouTube'});if(!tr)tr=d.results.find(function(v){return v.site==='YouTube'});if(tr)S.ytKey=tr.key}}).catch(function(){});
document.getElementById('mov').classList.add('on');document.body.style.overflow='hidden';
document.getElementById('mplay').onclick=function(){playItem(S.cur)};document.getElementById('mpb').onclick=function(){playItem(S.cur)};document.getElementById('mtrailer').onclick=function(){playTrailer()}}
function closeM(){document.getElementById('mov').classList.remove('on');document.body.style.overflow='';S.cur=null}

/* === PLAYER === */
function playItem(o){if(!o)return;var type=o.media_type||(o.first_air_date?'tv':'movie');var srv=(o._srv||0)%EM.length;var url=EM[srv](o.id,type);toast('Servidor '+(srv+1)+'...','i');openPl(url,o.title||o.name||'',false)}

function playTrailer(){if(!S.ytKey){toast('Trailer indisponivel','e');return}var url='https://www.youtube.com/embed/'+S.ytKey+'?autoplay=1&rel=0';toast('Carregando trailer...','i');openPl(url,S.cur?(S.cur.title||S.cur.name||''):'Trailer',false)}

function playTV(ch){toast('Canal: '+ch.name,'i');openPl(ch.url,ch.name,true)}

function openPl(url,title,isVid){var plr=document.getElementById('plr'),pld=document.getElementById('pld'),per=document.getElementById('per'),pif=document.getElementById('pif'),pvid=document.getElementById('pvid');plr.classList.add('on');pld.style.display='flex';per.style.display='none';document.getElementById('ptitle').textContent=title;document.body.style.overflow='hidden';
if(S.hls){S.hls.destroy();S.hls=null}pif.style.display='none';pif.src='about:blank';pvid.style.display='none';pvid.src='';
document.getElementById('peretry').onclick=function(){if(S.cur){S.cur._srv=((S.cur._srv||0)+1)%EM.length;playItem(S.cur)}};
if(isVid){pvid.style.display='block';if(url.indexOf('.m3u8')!==-1&&typeof Hls!=='undefined'&&Hls.isSupported()){var hls=new Hls();S.hls=hls;hls.loadSource(url);hls.attachMedia(pvid);hls.on(Hls.Events.MANIFEST_PARSED,function(){pld.style.display='none';pvid.play()});hls.on(Hls.Events.ERROR,function(ev,data){if(data.fatal){pld.style.display='none';per.style.display='flex'}})}else{pvid.src=url;pvid.onloadeddata=function(){pld.style.display='none'};pvid.onerror=function(){pld.style.display='none';per.style.display='flex'};pvid.play().catch(function(){})}}else{pif.style.display='block';pif.onload=function(){pld.style.display='none';per.style.display='none'};pif.onerror=function(){pld.style.display='none';per.style.display='flex'};pif.src=url;setTimeout(function(){if(pld.style.display!=='none'){pld.style.display='none'}},12000)}}

function closePl(){document.getElementById('plr').classList.remove('on');var pif=document.getElementById('pif');pif.src='about:blank';pif.style.display='none';var pvid=document.getElementById('pvid');pvid.pause();pvid.src='';pvid.style.display='none';if(S.hls){S.hls.destroy();S.hls=null}document.body.style.overflow='';clearTimeout(S.barT)}
function togBar(){var b=document.getElementById('pb');b.classList.toggle('hide');clearTimeout(S.barT);if(!b.classList.contains('hide'))S.barT=setTimeout(function(){b.classList.add('hide')},4000)}

/* === REFRESH === */
function doRef(){var b=document.getElementById('refbtn');b.classList.add('spin');toast('Atualizando...','i');loadCat(S.cat);setTimeout(function(){b.classList.remove('spin');toast('Atualizado!','s')},1500)}

/* === PULL === */
var pullY=0,pulling=false;
document.addEventListener('touchstart',function(e){if(window.scrollY<=0&&e.touches.length===1){pullY=e.touches[0].clientY;pulling=true}},{passive:true});
document.addEventListener('touchmove',function(e){if(!pulling)return;var dy=e.touches[0].clientY-pullY;if(dy>0&&window.scrollY<=0&&dy>60){pulling=false;doRef()}},{passive:true});
document.addEventListener('touchend',function(){pulling=false},{passive:true});

/* === INIT === */
function init(){
document.getElementById('hplay').onclick=function(){if(S.hero.length)playItem(S.hero[S.hi])};
document.getElementById('hinfo').onclick=function(){if(S.hero.length)openM(S.hero[S.hi])};
document.getElementById('mx').onclick=closeM;
document.getElementById('mov').onclick=function(e){if(e.target===e.currentTarget)closeM()};
document.getElementById('pback').onclick=closePl;
document.getElementById('pfs').onclick=function(){var w=document.getElementById('pw');if(w.requestFullscreen)w.requestFullscreen();else if(w.webkitRequestFullscreen)w.webkitRequestFullscreen()};
document.getElementById('ptp').onclick=togBar;
document.getElementById('refbtn').onclick=doRef;
var sr=document.getElementById('srch'),si=document.getElementById('sinp'),sb=document.getElementById('sbtn');sb.onclick=function(){sr.classList.toggle('open');if(sr.classList.contains('open'))si.focus()};var stm;si.oninput=function(e){clearTimeout(stm);stm=setTimeout(function(){S.q=e.target.value.trim();doSrch(S.q)},400)};
document.getElementById('cats').onclick=function(e){var b=e.target.closest('button[data-c]');if(b)loadCat(b.getAttribute('data-c'))};
window.addEventListener('scroll',function(){document.getElementById('nav').style.boxShadow=window.scrollY>30?'0 2px 12px rgba(0,0,0,.3)':'none'},{passive:true});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(document.getElementById('plr').classList.contains('on'))closePl();else closeM()}});
loadHome();
setTimeout(function(){document.getElementById('splash').classList.add('gone')},1600);
checkUpd();setInterval(checkUpd,60000);
}
init();
</script>
