<style>
:root{--bg:#0b1021;--bg-s:#131a2e;--bg-c:#1a2240;--bg-e:#212b4a;--acc:#0063e5;--acc-h:#0483dd;--acc-g:rgba(0,99,229,.35);--tx:#f0f1f5;--tx-m:#8990a8;--tx-d:#5a6178;--bd:rgba(255,255,255,.06);--nav:60px;--rad:8px;--rad-lg:14px;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--tx);overflow-x:hidden;min-height:100vh;min-height:100dvh}
::-webkit-scrollbar{height:3px;width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bg-e);border-radius:10px}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer;border:none;background:none;color:var(--tx);-webkit-tap-highlight-color:transparent}img{display:block;max-width:100%}

#splash{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s,visibility .5s}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
#splash .mark{font-size:2.6rem;font-weight:900;letter-spacing:-1px;background:linear-gradient(135deg,#0063e5,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:pulse 1.4s ease-in-out infinite}
#splash .bar{margin-top:24px;width:160px;height:3px;background:var(--bg-c);border-radius:3px;overflow:hidden}
#splash .bar-in{height:100%;width:0;background:linear-gradient(90deg,#0063e5,#00d4ff);border-radius:3px;animation:fill 1.8s ease forwards}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}@keyframes fill{to{width:100%}}

#topnav{position:fixed;top:0;left:0;right:0;z-index:1000;padding-top:var(--safe-top);height:calc(var(--nav) + var(--safe-top));display:flex;align-items:center;gap:10px;padding-left:14px;padding-right:14px;background:linear-gradient(180deg,rgba(11,16,33,.97),rgba(11,16,33,.75));backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--bd);transition:background .3s}
#topnav.solid{background:rgba(11,16,33,.99)}
.nav-brand{font-size:1.15rem;font-weight:900;letter-spacing:-.5px;background:linear-gradient(135deg,#0063e5,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;flex-shrink:0;width:40px;text-align:center}
.nav-cats{display:flex;gap:4px;flex:1;overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none}.nav-cats::-webkit-scrollbar{display:none}
.nav-cats button{padding:6px 12px;border-radius:18px;font-size:.76rem;font-weight:600;white-space:nowrap;color:var(--tx-m);transition:all .2s}
.nav-cats button.on{background:var(--acc);color:#fff}.nav-cats button:not(.on):hover{color:var(--tx)}
.nav-ico{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--tx-m);transition:all
