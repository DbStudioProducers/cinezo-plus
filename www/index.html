<style>
:root{--bg:#0b1021;--bg-s:#131a2e;--bg-c:#1a2240;--bg-e:#212b4a;--acc:#0063e5;--acc-h:#0483dd;--acc-g:rgba(0,99,229,.35);--tx:#f0f1f5;--tx-m:#8990a8;--tx-d:#5a6178;--bd:rgba(255,255,255,.06);--nav:60px;--rad:8px;--rad-lg:14px;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--tx);overflow-x:hidden;min-height:100vh;min-height:100dvh}

#topnav{position:fixed;top:0;left:0;right:0;z-index:1000;padding-top:var(--safe-top);height:calc(var(--nav) + var(--safe-top));display:flex;align-items:center;gap:12px;padding-left:16px;padding-right:16px;background:linear-gradient(180deg,rgba(11,16,33,.97),rgba(11,16,33,.75));backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--bd);transition:background .3s}

.nav-globe{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:18px;background:var(--bg-c);border:1px solid var(--bd);font-size:.85rem;color:var(--tx-m);transition:all .2s;flex-shrink:0}.nav-globe:hover{border-color:var(--acc);color:var(--acc)}
#main{padding-top:calc(var(--nav) + var(--safe-top));min-height:100vh;min-height:100dvh}

.btn-w{display:inline-flex;align-items:center;gap:7px;padding:12px 24px;border-radius:6px;background:#fff;color:#0b1021;font-size:.9rem;font-weight:700;transition:all .2s}.btn-w:hover{background:#d4e4ff;transform:scale(1.03)}
.btn-g{display:inline-flex;align-items:center;gap:7px;padding:12px 24px;border-radius:6px;background:rgba(255,255,255,.12);color:#fff;font-size:.9rem;font-weight:600;backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);transition:all .2s}.btn-g:hover{background:rgba(255,255,255,.2)}

.cd{flex:0 0 auto;width:150px;border-radius:var(--rad);overflow:hidden;position:relative;cursor:pointer;scroll-snap-align:start;transition:transform .3s cubic-bezier(.23,1,.32,1),box-shadow .3s;background:var(--bg-c)}
.cd:hover{transform:scale(1.06) translateY(-4px);box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 0 2px var(--acc);z-index:10}

.cw .ar{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:70px;display:flex;align-items:center;justify-content:center;background:rgba(11,16,33,.7);backdrop-filter:blur(6px);border-radius:4px;font-size:.85rem;color:#fff;z-index:5;opacity:0;transition:all .2s}
.cw:hover .ar{opacity:1}.ar:hover{background:rgba(0,99,229,.8)}.ar.l{left:0}.ar.r{right:0}
.sk{flex:0 0 auto;width:150px;border-radius:var(--rad);overflow:hidden;background:var(--bg-c)}.sk .si{width:100%;aspect-ratio:16/9;background:linear-gradient(90deg,var(--bg-c) 25%,var(--bg-e) 50%,var(--bg-c) 75%);background-size:200% 100%;animation:shim 1.5s infinite}
@keyframes shim{0%{background-position:200% 0}to{background-position:-200% 0}}

#modal-ov.on{opacity:1;visibility:visible}
#mdl{width:92%;max-width:600px;max-height:85vh;background:var(--bg-s);border-radius:var(--rad-lg);overflow:hidden;position:relative;transform:translateY(24px) scale(.96);transition:transform .4s cubic-bezier(.23,1,.32,1)}

#mdl-x{position:absolute;top:10px;right:10px;z-index:10;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;font-size:.8rem;transition:background .2s}#mdl-x:hover{background:var(--acc)}

#mdl-bd{padding:0 20px 20px;margin-top:-32px;position:relative;z-index:2}#mdl-bd h2{font-size:1.3rem;font-weight:900;margin-bottom:6px}
.mdl-mt{display:flex;gap:10px;flex-wrap:wrap;font-size:.72rem;color:var(--tx-m);margin-bottom:14px}.mdl-mt span{display:flex;align-items:center;gap:4px}

#bview{position:fixed;inset:0;z-index:3000;background:var(--bg);display:none;flex-direction:column}#bview.on{display:flex}
#bbar{padding-top:var(--safe-top);height:calc(48px + var(--safe-top));display:flex;align-items:center;gap:8px;padding-left:8px;padding-right:8px;background:var(--bg-s);border-bottom:1px solid var(--bd);flex-shrink:0}

#burl{flex:1;padding:7px 12px;border-radius:8px;background:var(--bg-c);border:1px solid var(--bd);color:var(--tx);font-size:.75rem;outline:none;min-width:0}
#bframe{flex:1;border:none;width:100%;background:#fff}
#toasts{position:fixed;top:calc(var(--nav) + var(--safe-top) + 8px);right:12px;z-index:5000;display:flex;flex-direction:column;gap:6px}
.tst{padding:10px 16px;border-radius:var(--rad);background:var(--bg-e);border:1px solid var(--bd);font-size:.8rem;font-weight:500;box-shadow:0 6px 24px rgba(0,0,0,.5);animation:tin .35s ease-out;display:flex;align-items:center;gap:8px}
.tst.err{border-color:#e53e3e;color:#fc8181}.tst.ok{border-color:#38a169;color:#68d391}.tst.inf{border-color:var(--acc);color:#63b3ed}
@keyframes tin{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
.empty{text-align:center;padding:60px 20px}.empty i{font-size:2.4rem;color:var(--tx-d);margin-bottom:14px}.empty h3{font-size:1.1rem;font-weight:700;margin-bottom:6px}.empty p{color:var(--tx-m);font-size:.85rem}
footer{padding:24px 20px calc(24px + var(--safe-bottom));text-align:center;color:var(--tx-d);font-size:.7rem;border-top:1px solid var(--bd)}footer a{color:var(--acc)}
@media(prefers-reduced-motion:no-preference){.sec{opacity:0;transform:translateY(24px);transition:opacity .5s,transform .5s}.sec.vis{opacity:1;transform:translateY(0)}}
@media(min-width:768px){:root{--nav:64px}.cd{width:200px}.sk{width:200px}.sec{padding:0 40px 36px}#hero{height:65vh;min-height:420px}#hero-info{left:40px;right:45%}#hero-info h1{font-size:2.6rem}#hero-dots{left:40px}.nav-search{width:200px}.nav-search.open{width:240px}.nav-search input{opacity:1}.nav-search .s-btn{right:auto;left:0}}
@media(min-width:1200px){.cd{width:220px}.sk{width:220px}#hero-info{right:55%}#hero-info h1{font-size:3rem}}
</style>

<script>
var BASE='https://cinezo.net';
var PROX=[function(u){return 'https://api.allorigins.win/get?url='+encodeURIComponent(u)},function(u){return 'https://corsproxy.io/?'+encodeURIComponent(u)},function(u){return 'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u)}];

function rurl(u,b){b=b||BASE;if(!u)return'';if(/^https?:\/\//.test(u))return u;if(/^\/\//.test(u))return'https:'+u;if(u.charAt(0)==='/')return b+u;return b+'/'+u}

function pfetch(url){var err;return new Promise(function(resolve,reject){var i=0;function tryNext(){if(i>=PROX.length){reject(err||new Error('Falha'));return}var mk=PROX[i];i++;var pu=mk(url);var ct=new AbortController();var tm=setTimeout(function(){ct.abort()},15000);fetch(pu,{signal:ct.signal}).then(function(r){clearTimeout(tm);if(!r.ok)throw new Error('status');return r.text()}).then(function(t){try{var j=JSON.parse(t);if(j.contents){resolve(j.contents);return}}catch(e){}resolve(t)}).catch(function(e){clearTimeout(tm);err=e;tryNext()})}tryNext()})}
function parse(html,src){src=src||BASE;var dp=new DOMParser();var doc=dp.parseFromString(html,'text/html');var items=[];var seen=new Set();function add(o){if(!o.link||!o.img)return;o.link=rurl(o.link,src);o.img=rurl(o.img,src);if(o.link.indexOf('cinezo.net')!==-1&&!seen.has(o.link)){seen.add(o.link);items.push(o)}}

function mkCard(o){var d=document.createElement('div');d.className='cd';d.tabIndex=0;d.setAttribute('role','button');d.setAttribute('aria-label',o.title);var fb="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 180'%3E%3Crect fill='%231a2240' width='320' height='180'/%3E%3Ctext x='160' y='90' fill='%235a6178' text-anchor='middle' font-size='13'%3ESem imagem%3C/text%3E%3C/svg%3E";d.innerHTML='<img src="'+o.img+'" alt="'+o.title+'" loading="lazy" onerror="this.src=\''+fb+'\'"><div class="cov"><div class="cp"><i class="fas fa-play" style="margin-left:2px"></i></div><h3>'+o.title+'</h3><div class="mt">'+(o.desc?o.desc.substring(0,50)+'...':'CineZo')+'</div></div>';d.onclick=function(){openMdl(o)};d.onkeydown=function(e){if(e.key==='Enter')openMdl(o)};return d}
function mkSks(n){n=n||8;var arr=[];for(var i=0;i<n;i++){var d=document.createElement('div');d.className='sk';d.innerHTML='<div class="si"></div>';arr.push(d)}return arr}
function rSec(title,items,ctn){if(!items.length)return;var sec=document.createElement('section');sec.className='sec';var id=title.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');sec.innerHTML='<div class="sec-h"><h2>'+title+'</h2></div><div class="cw"><button class="ar l" aria-label="Anterior"><i class="fas fa-chevron-left"></i></button><div class="cr" id="r-'+id+'"></div><button class="ar r" aria-label="Proximo"><i class="fas fa-chevron-right"></i></button></div>';var row=sec.querySelector('.cr');for(var i=0;i<items.length;i++){row.appendChild(mkCard(items[i]))}sec.querySelector('.ar.l').onclick=function(){row.scrollBy({left:-600,behavior:'smooth'})};sec.querySelector('.ar.r').onclick=function(){row.scrollBy({left:600,behavior:'smooth'})};ctn.appendChild(sec);requestAnimationFrame(function(){var ob=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('vis');ob.unobserve(e.target)}})},{threshold:.08});ob.observe(sec)})}
function rAll(){var c=document.getElementById('secs');c.innerHTML='';var f=S.items;if(S.q)f=f.filter(function(i){return i.title.toLowerCase().indexOf(S.q.toLowerCase())!==-1});if(!f.length){c.innerHTML='<div class="empty"><i class="fas fa-'+(S.q?'search':'satellite-dish')+'"></i><h3>'+(S.q?'Nenhum resultado para &quot;'+S.q+'&quot;':'Conteudo indisponivel')+'</h3><p>'+(S.q?'Tente outro termo.':'Use o botao Navegar para acessar o site.')+'</p>'+(S.q?'':'<button class="btn-w" style="margin-top:16px" onclick="openBr()"><i class="fas fa-globe"></i> Navegar</button>')+'</div>';return}
var names=['Em Alta','Populares','Para Voce','Mais Vistos','Destaques','Catalogo','Novidades','Recomendados','Top Picks','Explorar'];var per=Math.min(18,Math.ceil(f.length/Math.max(1,Math.floor(f.length/14))));var idx=0,si=0;while(idx<f.length&&si<10){rSec(names[si%names.length],f.slice(idx,idx+per),c);idx+=per;si++}}
function openMdl(o){document.getElementById('mdl-img').src=o.img;document.getElementById('mdl-t').textContent=o.title;document.getElementById('mdl-d').textContent=o.desc||'Clique em Assistir Agora para ver o conteudo completo no CineZo.';document.getElementById('mdl-mt').innerHTML='<span><i class="fas fa-play-circle"></i> CineZo</span><span><i class="fas fa-globe"></i> Online</span><span><i class="fas fa-hd"></i> HD</span>';document.getElementById('modal-ov').classList.add('on');document.body.style.overflow='hidden';document.getElementById('mdl-play').onclick=function(){openBr(o.link)};document.getElementById('mdl-site').onclick=function(){window.open(o.link,'_blank')}}
function closeMdl(){document.getElementById('modal-ov').classList.remove('on');document.body.style.overflow=''}
function openBr(u){u=u||BASE;document.getElementById('bview').classList.add('on');document.getElementById('burl').value=u;document.getElementById('bframe').src=u;document.body.style.overflow='hidden'}
function closeBr(){document.getElementById('bview').classList.remove('on');document.getElementById('bframe').src='about:blank';document.body.style.overflow=''}
function loadCat(cat){S.cat=cat;var btns=document.querySelectorAll('.nav-cats button');for(var i=0;i<btns.length;i++){btns[i].classList.toggle('on',btns[i].getAttribute('data-c')===cat)}if(cat==='home'){rAll();return}
var c=document.getElementById('secs');c.innerHTML='';var sec=document.createElement('section');sec.className='sec';sec.innerHTML='<div class="sec-h"><h2>Carregando...</h2></div><div class="cw"><div class="cr" id="r-load"></div></div>';c.appendChild(sec);var loadRow=sec.querySelector('.cr');var sks=mkSks(10);for(var j=0;j<sks.length;j++){loadRow.appendChild(sks[j])}
var urls={filmes:['/filmes','/category/filmes','/filme'],series:['/series','/category/series','/serie'],animes:['/animes','/category/animes','/anime'],novos:['/lancamentos','/category/lancamentos','/novos','/page/1']};var paths=urls[cat]||[];var items=[];
(function tryPath(pi){if(pi>=paths.length){c.innerHTML='<div class="empty"><i class="fas fa-film"></i><h3>Categoria indisponivel</h3><p>Use o modo Navegacao para explorar.</p><button class="btn-w" style="margin-top:16px" onclick="openBr()"><i class="fas fa-globe"></i> Navegar</button></div>';return}pfetch(BASE+paths[pi]).then(function(h){items=parse(h,BASE+paths[pi]);if(items.length>=3){c.innerHTML='';S.q='';document.getElementById('sinput').value='';rSec(cat.charAt(0).toUpperCase()+cat.slice(1),items,c)}else{tryPath(pi+1)}}).catch(function(){tryPath(pi+1)})})(0)}
function init(){document.getElementById('hplay').onclick=function(){if(S.hero.length)openBr(S.hero[S.hIdx].link)};document.getElementById('hinfo').onclick=function(){if(S.hero.length)openMdl(S.hero[S.hIdx])};document.getElementById('mdl-x').onclick=closeMdl;document.getElementById('modal-ov').onclick=function(e){if(e.target===e.currentTarget)closeMdl()};document.getElementById('globebtn').onclick=function(){openBr()};document.getElementById('bback').onclick=closeBr;document.getElementById('bhome').onclick=function(){document.getElementById('bframe').src=BASE;document.getElementById('burl').value=BASE};document.getElementById('bref').onclick=function(){var f=document.getElementById('bframe');f.src=f.src};document.getElementById('bext').onclick=function(){window.open(document.getElementById('burl').value,'_blank')};
var ns=document.getElementById('nsearch'),si=document.getElementById('sinput'),sb=document.getElementById('sbtn');sb.onclick=function(){ns.classList.toggle('open');if(ns.classList.contains('open'))si.focus()};var stm;si.oninput=function(e){clearTimeout(stm);stm=setTimeout(function(){S.q=e.target.value.trim();rAll()},300)};
document.getElementById('navcats').onclick=function(e){var b=e.target.closest('button[data-c]');if(b)loadCat(b.getAttribute('data-c'))};window.addEventListener('scroll',function(){document.getElementById('topnav').classList.toggle('solid',window.scrollY>30)},{passive:true});document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(document.getElementById('bview').classList.contains('on'))closeBr();else closeMdl()}});
pfetch(BASE).then(function(html){var items=parse(html);if(!items.length)throw new Error('vazio');S.items=items;S.hero=items.filter(function(i){return i.img&&i.title}).slice(0,8);S.hIdx=0;rHero();rHInt();rAll();toast(items.length+' conteudos carregados!','ok')}).catch(function(e){console.error(e);toast('Conteudo indisponivel. Use Navegacao.','err');document.getElementById('htitle').textContent='CineZo+';document.getElementById('hdesc').textContent='Use o botao Navegar para acessar o site completo.';document.getElementById('hero-bg').style.background='linear-gradient(135deg,#0b1021,#1a2240,#0b1021)';document.getElementById('secs').innerHTML='<div class="empty"><i class="fas fa-satellite-dish"></i><h3>Modo Navegacao Disponivel</h3><p>O conteudo sera carregado diretamente do site.</p><button class="btn-w" style="margin-top:16px" onclick="openBr()"><i class="fas fa-globe"></i> Abrir Navegacao</button></div>'});
var sp=document.getElementById('splash');sp.classList.add('hide');setTimeout(function(){sp.remove()},500)}
init();
